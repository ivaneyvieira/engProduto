
vaadinVersion=24.9.13
karibuDslVersion=2.2.0
vaadinBootVersion=13.3
vaadinSimpleSecurityVersion=1.0
slf4jVersion=2.0.16

# Reutilizar o Gradle Daemon entre compilações
org.gradle.daemon=true

# Memória máxima do Gradle
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Memória máxima do compilador Kotlin
kotlin.daemon.jvmargs=-Xmx2g

# Encerrar daemon após 2 minutos de inatividade
org.gradle.daemon.idletimeout=120000
